name: Deploy API to ECS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push API Image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file Dockerfile \
            --tag ${{ vars.AWS_ECR_API_REPO_URL }}:latest \
            --push .

      - name: Build and Push Migrations Image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file Dockerfile.migrations \
            --tag ${{ vars.AWS_ECR_MIGRATIONS_REPO_URL }}:latest \
            --push .

      - name: Run Database Migrations
        run: |
          # Start the migration task
          TASK_ARN=$(aws ecs run-task \
            --region ${{ vars.AWS_REGION }} \
            --cluster ${{ vars.AWS_ECS_CLUSTER_NAME }} \
            --task-definition ${{ vars.AWS_MIGRATIONS_TASK_DEFINITION_NAME }} \
            --launch-type FARGATE \
            --network-configuration '${{ vars.AWS_NETWORK_CONFIGURATION }}' \
            --query "tasks[0].taskArn" \
            --output text)
          TASK_ID=$(echo $TASK_ARN | awk -F/ '{print $NF}')
          echo "Started migrations task: $TASK_ARN"
          
          # Wait until the task enters the STOPPED state
          echo "Waiting for task to finish..."
          aws ecs wait tasks-stopped \
            --region ${{ vars.AWS_REGION }} \
            --cluster ${{ vars.AWS_ECS_CLUSTER_NAME }} \
            --tasks "$TASK_ARN"
          
          # Wait 15 seconds for CloudWatch ingestion to finalize
          sleep 15
          
          # Output logs from the task
          echo "--- BEGIN MIGRATION LOGS ---"
          aws logs tail "${{ vars.AWS_MIGRATIONS_LOG_GROUP_NAME }}" \
            --region ${{ vars.AWS_REGION }} \
            --log-stream-name-prefix "${{ vars.AWS_MIGRATIONS_LOG_STREAM_PREFIX }}/$TASK_ID" \
            --format short
          echo "--- END MIGRATION LOGS ---"
          
          # Check if the task failed or was killed
          EXIT_CODE=$(aws ecs describe-tasks \
            --region ${{ vars.AWS_REGION }} \
            --cluster ${{ vars.AWS_ECS_CLUSTER_NAME }} \
            --tasks "$TASK_ARN" \
            --query "tasks[0].containers[0].exitCode" \
            --output text)
          
          if [ "$EXIT_CODE" = "None" ] || [ "$EXIT_CODE" -ne 0 ]; then
            echo "Error: Migration failed or container was stopped prematurely. Exit code: $EXIT_CODE"
            exit 1
          fi
          
          echo "Task finished successfully!"

      - name: Force ECS Service Deployment
        run: |
          echo "Not implemented"
