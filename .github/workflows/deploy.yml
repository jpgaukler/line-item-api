name: Deploy API to ECS

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  
  ECS_CLUSTER_NAME: ${{ vars.AWS_ECS_CLUSTER_NAME }}
  
  API_IMAGE_TAG: "${{ vars.AWS_ECR_API_REPO_URL }}:${{ github.sha }}"
  API_SERVICE_NAME: ${{ vars.AWS_ECS_SERVICE_NAME }}
  API_CONTAINER_NAME: ${{ vars.AWS_API_CONTAINER_NAME }}
  API_TASK_DEFINITION_FAMILY: ${{ vars.AWS_API_TASK_DEFINITION_FAMILY_NAME }}
  
  MIGRATIONS_IMAGE_TAG: "${{ vars.AWS_ECR_MIGRATIONS_REPO_URL }}:${{ github.sha }}"
  MIGRATIONS_CONTAINER_NAME: ${{ vars.AWS_MIGRATIONS_CONTAINER_NAME }}
  MIGRATIONS_TASK_DEFINITION_FAMILY: ${{ vars.AWS_MIGRATIONS_TASK_DEFINITION_FAMILY_NAME }}
  RUN_TASK_SUBNET_IDS: ${{ vars.AWS_RUN_TASK_SUBNET_IDS }}
  RUN_TASK_SECURITY_GROUP_ID: ${{ vars.AWS_RUN_TASK_SECURITY_GROUP_ID }}

jobs:
  build-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Migrations Image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file Dockerfile.migrations \
            --tag $MIGRATIONS_IMAGE_TAG \
            --push .

  migrate-database:
    runs-on: ubuntu-latest
    needs: build-migrations
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS Task Definition
        id: update-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: ${{ env.MIGRATIONS_TASK_DEFINITION_FAMILY }}
          container-name: ${{ env.MIGRATIONS_CONTAINER_NAME }}
          image: ${{ env.MIGRATIONS_IMAGE_TAG }}

      - name: Deploy ECS Task Definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.update-task.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER_NAME }}
          run-task: true
          run-task-security-groups: ${{ env.RUN_TASK_SECURITY_GROUP_ID }}
          run-task-subnets: ${{ env.RUN_TASK_SUBNET_IDS }}
          run-task-assign-public-IP: DISABLED
          wait-for-task-stopped: true
          
