name: Deploy to Dev

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  API_IMAGE_TAG: "${{ vars.AWS_ECR_API_REPO_URL }}:${{ github.sha }}"
  MIGRATIONS_IMAGE_TAG: "${{ vars.AWS_ECR_MIGRATIONS_REPO_URL }}:${{ github.sha }}"

jobs:
  build-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Migrations Image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file Dockerfile.migrations \
            --tag $MIGRATIONS_IMAGE_TAG \
            --push .

  build-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push API Image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file Dockerfile \
            --tag $API_IMAGE_TAG \
            --push .
  
  migrate-database:
    needs: build-migrations
    uses: ./.github/workflows/migrate-database-job.yml
    with:
      environment: dev
      image-tag: ${{ env.MIGRATIONS_IMAGE_TAG }}
    secrets: inherit
  
  deploy-api:
    needs: [ build-api, migrate-database ]
    uses: ./.github/workflows/deploy-api-job.yml
    with:
      environment: dev
      api-image-tag: ${{ env.API_IMAGE_TAG }}
    secrets: inherit
