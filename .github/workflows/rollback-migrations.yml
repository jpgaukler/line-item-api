name: Rollback Database Migrations

on:
  workflow_dispatch:
    inputs:
      downgradeToRevision:
        description: 'The database migration revision number to downgrade to (e.g., 0)'
        required: true
        type: string

env:
  AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECS_CLUSTER_NAME: ${{ vars.AWS_ECS_CLUSTER_NAME }}
  TASK_DEFINITION_FAMILY: ${{ vars.AWS_MIGRATIONS_TASK_DEFINITION_FAMILY_NAME }}
  SUBNET_IDS: ${{ vars.AWS_RUN_TASK_SUBNET_IDS }}
  SECURITY_GROUP_ID: ${{ vars.AWS_RUN_TASK_SECURITY_GROUP_ID }}
  CONTAINER_OVERRIDES: |
    [
      {
        "name": "${{ vars.AWS_MIGRATIONS_CONTAINER_NAME }}",
        "command": ["--downgradeToRevision=${{ inputs.downgradeToRevision }}"]
      }
    ]

jobs:
  rollback-migrations:
    runs-on: ubuntu-latest
    
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Latest Task Definition
        id: task-def
        run: |
          TASK_DEF_ARN=$(aws ecs describe-task-definition \
            --task-definition ${{ env.MIGRATIONS_TASK_DEFINITION_FAMILY }} \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT

      - name: Deploy ECS Task Definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.arn }}
          cluster: ${{ env.ECS_CLUSTER_NAME }}
          run-task: true
          run-task-security-groups: ${{ env.SECURITY_GROUP_ID }}
          run-task-subnets: ${{ env.SUBNET_IDS }}
          run-task-assign-public-IP: DISABLED
          run-task-container-overrides: ${{ env.CONTAINER_OVERRIDES }}
          wait-for-task-stopped: true

