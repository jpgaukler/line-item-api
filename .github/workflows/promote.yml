name: Promote

on:
  workflow_dispatch:
    inputs:
      target-environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod
      image-tag:
        description: 'Image tag'
        required: true
        type: string

env:
  API_IMAGE_TAG: "${{ vars.AWS_ECR_API_REPO_URL }}:${{ inputs.image-tag }}"
  MIGRATIONS_IMAGE_TAG: "${{ vars.AWS_ECR_MIGRATIONS_REPO_URL }}:${{ inputs.image-tag }}"

jobs:
  migrate-database:
    uses: ./.github/workflows/migrate-database-job.yml
    with:
      target-environment: ${{ inputs.target-environment }}
      image-tag: ${{ env.MIGRATIONS_IMAGE_TAG }}
    secrets: inherit
  
  deploy-api:
    needs: migrate-database
    uses: ./.github/workflows/deploy-api-job.yml
    with:
      target-environment: ${{ inputs.target-environment }}
      image-tag: ${{ env.API_IMAGE_TAG }}
    secrets: inherit
